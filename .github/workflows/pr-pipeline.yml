name: Create PR Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - 'feature/**'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Check if pom.xml exists
        id: check_pom
        run: test -f pom.xml && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT

      - name: Setup Java
        if: steps.check_pom.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run JUnit Tests
        if: steps.check_pom.outputs.exists == 'true'
        run: mvn clean test
        continue-on-error: true

      - name: No Maven Project Found
        if: steps.check_pom.outputs.exists == 'false'
        run: echo "Warning: No pom.xml found. Skipping Maven tests."

  static-analysis:
    name: Checkstyle and SpotBugs
    runs-on: ubuntu-latest
    needs: unit-tests
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Check if pom.xml exists
        id: check_pom
        run: test -f pom.xml && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        if: steps.check_pom.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Checkstyle
        if: steps.check_pom.outputs.exists == 'true'
        run: mvn checkstyle:check
        continue-on-error: true

      - name: SpotBugs
        if: steps.check_pom.outputs.exists == 'true'
        run: mvn spotbugs:check
        continue-on-error: true

      - name: No Maven Project Found
        if: steps.check_pom.outputs.exists == 'false'
        run: echo "Warning: No pom.xml found. Skipping static analysis."

  github-advanced-security:
    name: GitHub Advanced Security Scan
    runs-on: ubuntu-latest
    needs: static-analysis
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Check if pom.xml exists
        id: check_pom
        run: test -f pom.xml && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT

      - name: Initialize CodeQL
        if: steps.check_pom.outputs.exists == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build
        if: steps.check_pom.outputs.exists == 'true'
        run: mvn clean compile
        continue-on-error: true

      - name: Perform CodeQL Analysis
        if: steps.check_pom.outputs.exists == 'true'
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

      - name: No Maven Project Found
        if: steps.check_pom.outputs.exists == 'false'
        run: echo "Warning: No pom.xml found. Skipping CodeQL analysis."

  approval-gate:
    name: Approval Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, static-analysis, github-advanced-security]
    if: always()

    steps:
      - name: Workflow Validation Complete
        run: echo "PR validation pipeline completed successfully"
