name: Create PR Validation Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run JUnit Tests
        run: mvn clean test

  static-analysis:
    name: Checkstyle and SpotBugs
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Checkstyle
        run: mvn checkstyle:check

      - name: SpotBugs
        run: mvn spotbugs:check

  github-advanced-security:
    name: GitHub Advanced Security Scan
    runs-on: ubuntu-latest
    needs: static-analysis

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build
        run: mvn clean compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  wiz-security-scan:
    name: Wiz Security Scan
    runs-on: ubuntu-latest
    needs: github-advanced-security
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Wiz CLI Scan
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: |
          curl -fsSL https://downloads.wiz.io/wizcli/latest/wizcli-linux-amd64 -o wizcli
          chmod +x wizcli
          ./wizcli auth --id $WIZ_CLIENT_ID --secret $WIZ_CLIENT_SECRET
          ./wizcli scan dir .

  gemini-advisory-review:
    name: Gemini Advisory Review
    runs-on: ubuntu-latest
    needs: wiz-security-scan
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff || echo "No diff available"
          echo "diff_exists=true" >> $GITHUB_OUTPUT

      - name: Gemini Review
        if: env.GEMINI_API_KEY != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -s pr.diff ]; then
            PR_DIFF=$(cat pr.diff | head -c 10000)
            curl -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d @- <<EOF
          {
            "contents": [{
              "parts": [{
                "text": "Review the following PR changes for security and code quality:\n\n\${PR_DIFF}"
              }]
            }]
          }
          EOF
          fi

  approval-gate:
    name: Reviewer Approval Gate
    runs-on: ubuntu-latest
    needs: gemini-advisory-review
    if: always()

    steps:
      - name: Await Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: team-leads,architects
          minimum-approvals: 1