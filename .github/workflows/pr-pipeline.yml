name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  GAR_REGION: us-central1
  GAR_REPOSITORY: my-artifact-repo
  IMAGE_NAME: my-application
  PROJECT_ID: my-gcp-project

jobs:

  # ----------------------------------------
  # SAST
  # ----------------------------------------
  sast:
    name: SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

  # ----------------------------------------
  # SCA
  # ----------------------------------------
  sca:
    name: Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

  # ----------------------------------------
  # Build
  # ----------------------------------------
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs:
      - sast
      - sca

    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # Example for Java/Maven
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Application
        run: mvn clean package -DskipTests

      - name: Build Docker Image
        run: |
          docker build \
            -t $GAR_REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:${{ github.sha }} .

  # ----------------------------------------
  # Container Security Scan
  # ----------------------------------------
  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.GAR_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

  # ----------------------------------------
  # System Testing
  # ----------------------------------------
  system-test:
    name: System Testing
    runs-on: ubuntu-latest
    needs: container-scan

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Start Application
        run: |
          docker compose up -d

      - name: Execute System Tests
        run: |
          ./tests/system/run-tests.sh

      - name: Collect Logs
        if: always()
        run: docker compose logs

  # ----------------------------------------
  # Push Artifact to GAR
  # ----------------------------------------
  push-artifact:
    name: Push Image to GAR
    runs-on: ubuntu-latest
    needs: system-test

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
          $GAR_REGION-docker.pkg.dev

      - name: Build Image
        run: |
          docker build \
            -t $GAR_REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push \
          $GAR_REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:${{ github.sha }}

      - name: Output Image Reference
        run: |
          echo "Published image:"
          echo "$GAR_REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:${{ github.sha }}"
```
