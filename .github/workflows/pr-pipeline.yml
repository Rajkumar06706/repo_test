name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/test1
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  GAR_REGION: us-central1
  GAR_REPOSITORY: my-artifact-repo
  IMAGE_NAME: my-application
  PROJECT_ID: my-gcp-project

jobs:

  # ----------------------------------------
  # SAST
  # ----------------------------------------
  sast:
    name: SAST Scan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

  # ----------------------------------------
  # SCA
  # ----------------------------------------
  sca:
    name: Dependency Scan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

  # ----------------------------------------
  # Build
  # ----------------------------------------
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs:
      - sast
      - sca
    if: always()

    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # Check if pom.xml exists
      - name: Check if Maven project exists
        id: check_maven
        run: |
          if [ -f pom.xml ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Example for Java/Maven
      - name: Setup JDK
        if: steps.check_maven.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Application
        if: steps.check_maven.outputs.exists == 'true'
        run: mvn clean package -DskipTests
        continue-on-error: true

      - name: Skip Maven Build
        if: steps.check_maven.outputs.exists == 'false'
        run: echo "Warning: No pom.xml found. Skipping Maven build."

      - name: Check if Dockerfile exists
        id: check_docker
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker Image
        if: steps.check_docker.outputs.exists == 'true'
        run: |
          docker build \
            -t $GAR_REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:${{ github.sha }} .
        continue-on-error: true

      - name: Skip Docker Build
        if: steps.check_docker.outputs.exists == 'false'
        run: echo "Warning: No Dockerfile found. Skipping Docker build."

  # ----------------------------------------
  # Container Security Scan
  # ----------------------------------------
  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: build
    if: always()
    continue-on-error: true

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Check if image exists
        id: check_image
        run: |
          if docker inspect $GAR_REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Scan Docker Image
        if: steps.check_image.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.GAR_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Skip Container Scan
        if: steps.check_image.outputs.exists == 'false'
        run: echo "Warning: Docker image not found. Skipping container scan."

  # ----------------------------------------
  # System Testing
  # ----------------------------------------
  system-test:
    name: System Testing
    runs-on: ubuntu-latest
    needs: container-scan
    if: always()
    continue-on-error: true

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Check if docker-compose exists
        id: check_compose
        run: |
          if [ -f docker-compose.yml ] || [ -f docker-compose.yaml ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Start Application
        if: steps.check_compose.outputs.exists == 'true'
        run: |
          docker compose up -d
        continue-on-error: true

      - name: Check if test script exists
        id: check_tests
        run: |
          if [ -f ./tests/system/run-tests.sh ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Execute System Tests
        if: steps.check_tests.outputs.exists == 'true'
        run: |
          ./tests/system/run-tests.sh
        continue-on-error: true

      - name: Skip Tests
        if: steps.check_tests.outputs.exists == 'false'
        run: echo "Warning: Test script not found. Skipping system tests."

      - name: Collect Logs
        if: always() && steps.check_compose.outputs.exists == 'true'
        run: docker compose logs
        continue-on-error: true

  # ----------------------------------------
  # Push Artifact to GAR
  # ----------------------------------------
  push-artifact:
    name: Push Image to GAR
    runs-on: ubuntu-latest
    needs: system-test
    if: always()
    continue-on-error: true

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Check if Dockerfile exists
        id: check_docker
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        if: steps.check_docker.outputs.exists == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        continue-on-error: true

      - name: Configure Docker
        if: steps.check_docker.outputs.exists == 'true'
        run: |
          gcloud auth configure-docker \
          $GAR_REGION-docker.pkg.dev
        continue-on-error: true

      - name: Build Image
        if: steps.check_docker.outputs.exists == 'true'
        run: |
          docker build \
            -t $GAR_REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:${{ github.sha }} .
        continue-on-error: true

      - name: Push Image
        if: steps.check_docker.outputs.exists == 'true'
        run: |
          docker push \
          $GAR_REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:${{ github.sha }}
        continue-on-error: true

      - name: Output Image Reference
        if: steps.check_docker.outputs.exists == 'true'
        run: |
          echo "Published image:"
          echo "$GAR_REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:${{ github.sha }}"

      - name: Skip Push to GAR
        if: steps.check_docker.outputs.exists == 'false'
        run: echo "Warning: No Dockerfile found. Skipping push to GAR."
