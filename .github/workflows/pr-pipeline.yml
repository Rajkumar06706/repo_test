name: Create PR Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - 'feature/**'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run JUnit Tests
        run: mvn clean test
        continue-on-error: true

  static-analysis:
    name: Checkstyle and SpotBugs
    runs-on: ubuntu-latest
    needs: unit-tests
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Checkstyle
        run: mvn checkstyle:check
        continue-on-error: true

      - name: SpotBugs
        run: mvn spotbugs:check
        continue-on-error: true

  github-advanced-security:
    name: GitHub Advanced Security Scan
    runs-on: ubuntu-latest
    needs: static-analysis
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build
        run: mvn clean compile
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

  approval-gate:
    name: Approval Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, static-analysis, github-advanced-security]
    if: always()

    steps:
      - name: Workflow Validation Complete
        run: echo "PR validation pipeline completed successfully"
