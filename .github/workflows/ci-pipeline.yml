name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/test1
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  GAR_REGION: us-central1
  GAR_REPOSITORY: my-artifact-repo
  PROJECT_ID: my-gcp-project
  IMAGE_NAME: my-application

jobs:

  sast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade semgrep

      - name: Run Semgrep
        run: |
          semgrep scan --config auto .

  sca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy SCA Scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

  build:
    runs-on: ubuntu-latest
    needs:
      - sast
      - sca

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Maven Project
        run: mvn clean package -DskipTests

      - name: Build Docker Image
        run: |
          docker build \
            -t ${IMAGE_NAME}:${GITHUB_SHA} .

      - name: Save Docker Image
        run: |
          docker save \
            -o image.tar \
            ${IMAGE_NAME}:${GITHUB_SHA}

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  container-scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Image
        run: docker load -i image.tar

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: my-application:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

  system-test:
    runs-on: ubuntu-latest
    needs: container-scan

    steps:
      - uses: actions/checkout@v4

      - name: Run System Tests
        run: |
          if [ -f tests/system/run-tests.sh ]; then
            chmod +x tests/system/run-tests.sh
            ./tests/system/run-tests.sh
          else
            echo "No system tests found."
          fi

  push-artifact:
    runs-on: ubuntu-latest
    needs: system-test

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Image
        run: docker load -i image.tar

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GAR
        run: |
          gcloud auth configure-docker \
          ${GAR_REGION}-docker.pkg.dev

      - name: Tag Image
        run: |
          docker tag \
          ${IMAGE_NAME}:${GITHUB_SHA} \
          ${GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}

      - name: Push Image
        run: |
          docker push \
          ${GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}

