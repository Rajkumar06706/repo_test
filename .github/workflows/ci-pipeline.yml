name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/test1
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  GAR_REGION: us-central1
  GAR_REPOSITORY: my-artifact-repo
  IMAGE_NAME: my-application
  PROJECT_ID: my-gcp-project

jobs:

  # =====================================================
  # SAST
  # =====================================================
  sast:
    name: SAST Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

  # =====================================================
  # SCA
  # =====================================================
  sca:
    name: Software Composition Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

  # =====================================================
  # BUILD
  # =====================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs:
      - sast
      - sca

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        if: ${{ hashFiles('pom.xml') != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Maven Build
        if: ${{ hashFiles('pom.xml') != '' }}
        run: mvn clean package -DskipTests

      - name: Build Docker Image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: |
          docker build \
            -t $IMAGE_NAME:${GITHUB_SHA} .

      - name: Export Docker Image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: |
          docker save $IMAGE_NAME:${GITHUB_SHA} \
            -o image.tar

      - name: Upload Docker Image
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  # =====================================================
  # CONTAINER SCAN
  # =====================================================
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image
        run: |
          docker load -i image.tar

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: my-application:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

  # =====================================================
  # SYSTEM TEST
  # =====================================================
  system-test:
    name: System Testing
    runs-on: ubuntu-latest
    needs: container-scan

    steps:
      - uses: actions/checkout@v4

      - name: Start Environment
        if: ${{ hashFiles('docker-compose.yml') != '' || hashFiles('docker-compose.yaml') != '' }}
        run: docker compose up -d

      - name: Execute System Tests
        if: ${{ hashFiles('tests/system/run-tests.sh') != '' }}
        run: |
          chmod +x tests/system/run-tests.sh
          ./tests/system/run-tests.sh

      - name: Collect Logs
        if: ${{ always() }}
        run: |
          docker compose logs || true

  # =====================================================
  # PUSH TO GAR
  # =====================================================
  push-artifact:
    name: Push Image to GAR
    runs-on: ubuntu-latest
    needs: system-test

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image
        run: |
          docker load -i image.tar

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
          ${GAR_REGION}-docker.pkg.dev

      - name: Tag Image
        run: |
          docker tag \
          ${IMAGE_NAME}:${GITHUB_SHA} \
          ${GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}

      - name: Push Image
        run: |
          docker push \
          ${GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}

      - name: Published Image
        run: |
          echo "Published:"
          echo "${GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

